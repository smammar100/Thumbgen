<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <style>
    .bg-circle {
      fill: #000000;
      transition: fill 0.3s ease;
    }
    .dot {
      fill: rgba(255, 255, 255, 0.35);
      transition: fill 0.3s ease;
    }
    .dot-red {
      fill: #ff0000;
    }
    @media (prefers-color-scheme: dark) {
      .bg-circle {
        fill: #ffffff;
      }
      .dot {
        fill: rgba(12, 12, 12, 0.35);
      }
    }
  </style>
  <circle cx="16" cy="16" r="16" class="bg-circle" />
  <circle cx="10" cy="10" r="1.5" class="dot" />
  <circle cx="16" cy="10" r="1.5" class="dot" />
  <circle cx="22" cy="10" r="1.5" class="dot" />
  <circle cx="10" cy="16" r="1.5" class="dot" />
  <circle cx="16" cy="16" r="1.5" class="dot" />
  <circle cx="22" cy="16" r="1.5" class="dot" />
  <circle cx="10" cy="22" r="1.5" class="dot" />
  <circle cx="16" cy="22" r="1.5" class="dot" />
  <circle cx="22" cy="22" r="1.5" class="dot-red" />
</svg>
